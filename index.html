<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Задачи</title>
<style>
  :root{
    --bg:#f4f5f7;--panel:#ebecf0;--card:#fff;--text:#1f2328;--muted:#6b7280;
    --border:#dcdfe4;--accent:#4f46e5;--accent-text:#fff;--danger:#dc2626;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181d;--panel:#1f2228;--card:#2a2e36;--text:#e6e8eb;--muted:#9aa1ab;
      --border:#343a44;--accent:#818cf8;--accent-text:#111;--danger:#f87171;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
  header{display:flex;align-items:center;gap:10px;padding:14px 16px;flex-wrap:wrap}
  h1{font-size:20px;margin:0;margin-right:auto}
  #status{font-size:13px;color:var(--muted)}
  #status.error{color:var(--danger)}
  button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;padding:6px 12px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
  button.danger{color:var(--danger)}
  .tabs{display:flex;gap:6px;padding:0 16px;overflow-x:auto}
  .tab{white-space:nowrap}
  .tab.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
  .board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;padding:16px;overflow-x:auto;align-items:start}
  .col{background:var(--panel);border-radius:10px;padding:10px;min-height:160px;border-top:4px solid var(--c)}
  .col.over{outline:2px dashed var(--accent)}
  .col h2{font-size:14px;margin:2px 2px 10px;display:flex;justify-content:space-between;align-items:center}
  .count{font-weight:400;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--c);border-radius:8px;padding:10px;margin-bottom:8px;cursor:grab}
  .card.dragging{opacity:.4}
  .card .text{white-space:pre-wrap;word-break:break-word}
  .meta{font-size:12px;color:var(--muted);margin-top:6px}
  .actions{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
  .actions button{padding:2px 9px;font-size:13px}
  .empty{font-size:13px;color:var(--muted);text-align:center;padding:12px 0}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
  .modal-bg.show{display:flex}
  .modal{background:var(--card);border-radius:12px;padding:20px;width:100%;max-width:460px}
  .modal h3{margin:0 0 6px}
  .modal label{display:block;margin:12px 0 4px;font-size:13px;color:var(--muted)}
  input,textarea,select{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
  textarea{min-height:120px;resize:vertical}
  .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .msg{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}
  @media (max-width:640px){
    header{padding:12px}
    .board{padding:12px}
  }
</style>
</head>
<body>

<header>
  <h1>Задачи</h1>
  <span id="status"></span>
  <button id="btnAddBoard">+ Доска</button>
  <button id="btnAddTask" class="primary">+ Задача</button>
</header>
<nav class="tabs" id="tabs"></nav>
<main class="board" id="board"></main>

<!-- Вход -->
<div class="modal-bg" id="loginModal">
  <form class="modal" id="loginForm">
    <h3>Вход</h3>
    <label for="pw">Пароль</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <div class="msg" id="loginMsg"></div>
    <div class="row"><button class="primary" type="submit">Войти</button></div>
  </form>
</div>

<!-- Задача -->
<div class="modal-bg" id="taskModal">
  <form class="modal" id="taskForm">
    <h3 id="taskTitle">Новая задача</h3>
    <label for="tText">Что нужно сделать</label>
    <textarea id="tText" required></textarea>
    <div id="authorWrap">
      <label for="tAuthor">Кто добавляет</label>
      <input id="tAuthor" maxlength="60" placeholder="Имя">
    </div>
    <div id="statusWrap">
      <label for="tStatus">Статус</label>
      <select id="tStatus"></select>
    </div>
    <div class="row">
      <button type="button" id="tCancel">Отмена</button>
      <button type="submit" class="primary">Сохранить</button>
    </div>
  </form>
</div>

<script>
// ===== НАСТРОЙКА: вставь сюда ссылку на скрипт (заканчивается на /exec) =====
const API_URL = 'https://script.google.com/macros/s/AKfycbxlbXEfyXXNc44kdtqtwcwMTAQ_y6CZHHzfbgdAjiehC3Y1MnRWJ1f2EsBQ1laORzEICg/exec';

const STATUSES = [
  { key: 'new',         label: 'Новая',          color: '#9ca3af' },
  { key: 'seen',        label: 'Просмотрено',        color: '#0ea5e9' },
  { key: 'in_progress', label: 'В работе',       color: '#f59e0b' },
  { key: 'done',        label: 'Сделано',        color: '#22c55e' },
  { key: 'tested',      label: 'Протестировано', color: '#8b5cf6' }
];

let state = { boards: [], tasks: [] };
let password = store('tracker_pw') || '';
let currentBoard = store('tracker_board') || '';
let editingId = null;

const $ = function (s) { return document.querySelector(s); };

function store(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k);
    if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
  } catch (e) { return null; }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function fmt(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function setStatus(text, isError) {
  const el = $('#status');
  el.textContent = text;
  el.className = isError ? 'error' : '';
}

// ---------- Связь с таблицей ----------
async function api(action, data, silent) {
  if (!silent) setStatus('Сохраняю…');
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action, password: password }, data || {}))
    });
    const j = await res.json();
    if (!j.ok) {
      if (j.error === 'wrong_password') {
        password = '';
        store('tracker_pw', null);
        showLogin('Неверный пароль');
      } else {
        setStatus('Ошибка: ' + j.error, true);
        load(true);
      }
      return null;
    }
    state.boards = j.boards;
    state.tasks = j.tasks;
    render();
    setStatus('Обновлено ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }));
    return j;
  } catch (e) {
    setStatus('Нет связи с таблицей', true);
    return null;
  }
}

function load(silent) { return api('list', {}, silent); }

// ---------- Отрисовка ----------
function render() {
  if (!state.boards.some(function (b) { return b.id === currentBoard; })) {
    currentBoard = state.boards.length ? state.boards[0].id : '';
  }

  $('#tabs').innerHTML = state.boards.map(function (b) {
    return '<button class="tab' + (b.id === currentBoard ? ' active' : '') + '" data-id="' + esc(b.id) + '">' + esc(b.name) + '</button>';
  }).join('');

  const tasks = state.tasks
    .filter(function (t) { return t.board === currentBoard; })
    .sort(function (a, b) { return b.created - a.created; });

  $('#board').innerHTML = STATUSES.map(function (s, i) {
    const list = tasks.filter(function (t) { return t.status === s.key; });
    const cards = list.map(function (t) {
      return '<div class="card" draggable="true" data-id="' + esc(t.id) + '" style="--c:' + s.color + '">' +
        '<div class="text">' + esc(t.text) + '</div>' +
        '<div class="meta">' + esc(t.author) + ' · ' + fmt(t.created) + '</div>' +
        '<div class="actions">' +
          (i > 0 ? '<button data-act="prev" title="Назад">←</button>' : '') +
          (i < STATUSES.length - 1 ? '<button data-act="next" title="Вперёд">→</button>' : '') +
          '<button data-act="edit" title="Изменить">✎</button>' +
          '<button data-act="del" class="danger" title="Удалить">✕</button>' +
        '</div></div>';
    }).join('');
    return '<section class="col" data-status="' + s.key + '" style="--c:' + s.color + '">' +
      '<h2>' + s.label + ' <span class="count">' + list.length + '</span></h2>' +
      (cards || '<div class="empty">Пусто</div>') + '</section>';
  }).join('');
}

// ---------- Действия ----------
function moveTask(id, status) {
  const t = state.tasks.find(function (x) { return x.id === id; });
  if (!t || t.status === status) return;
  t.status = status;          // сразу показываем
  render();
  api('updateTask', { id: id, status: status });
}

$('#tabs').addEventListener('click', function (e) {
  const b = e.target.closest('.tab');
  if (!b) return;
  currentBoard = b.dataset.id;
  store('tracker_board', currentBoard);
  render();
});

$('#board').addEventListener('click', function (e) {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const id = btn.closest('.card').dataset.id;
  const t = state.tasks.find(function (x) { return x.id === id; });
  const i = STATUSES.findIndex(function (s) { return s.key === t.status; });
  const act = btn.dataset.act;
  if (act === 'prev') moveTask(id, STATUSES[i - 1].key);
  if (act === 'next') moveTask(id, STATUSES[i + 1].key);
  if (act === 'edit') openTask(t);
  if (act === 'del' && confirm('Удалить задачу?')) {
    state.tasks = state.tasks.filter(function (x) { return x.id !== id; });
    render();
    api('deleteTask', { id: id });
  }
});

// Перетаскивание карточек мышкой
$('#board').addEventListener('dragstart', function (e) {
  const c = e.target.closest('.card');
  if (!c) return;
  e.dataTransfer.setData('text/plain', c.dataset.id);
  c.classList.add('dragging');
});
$('#board').addEventListener('dragend', function (e) {
  const c = e.target.closest('.card');
  if (c) c.classList.remove('dragging');
});
$('#board').addEventListener('dragover', function (e) {
  const col = e.target.closest('.col');
  if (!col) return;
  e.preventDefault();
  document.querySelectorAll('.col.over').forEach(function (x) { if (x !== col) x.classList.remove('over'); });
  col.classList.add('over');
});
$('#board').addEventListener('dragleave', function (e) {
  const col = e.target.closest('.col');
  if (col && !col.contains(e.relatedTarget)) col.classList.remove('over');
});
$('#board').addEventListener('drop', function (e) {
  const col = e.target.closest('.col');
  if (!col) return;
  e.preventDefault();
  col.classList.remove('over');
  moveTask(e.dataTransfer.getData('text/plain'), col.dataset.status);
});

// Новая доска
$('#btnAddBoard').addEventListener('click', async function () {
  const name = (prompt('Название новой доски') || '').trim();
  if (!name) return;
  const before = state.boards.map(function (b) { return b.id; });
  const j = await api('addBoard', { name: name });
  if (j) {
    const added = j.boards.find(function (b) { return before.indexOf(b.id) < 0; });
    if (added) { currentBoard = added.id; store('tracker_board', currentBoard); render(); }
  }
});

// Окно задачи
$('#tStatus').innerHTML = STATUSES.map(function (s) {
  return '<option value="' + s.key + '">' + s.label + '</option>';
}).join('');

function openTask(t) {
  editingId = t ? t.id : null;
  $('#taskTitle').textContent = t ? 'Изменить задачу' : 'Новая задача';
  $('#tText').value = t ? t.text : '';
  $('#tAuthor').value = store('tracker_author') || '';
  $('#authorWrap').style.display = t ? 'none' : '';
  $('#statusWrap').style.display = t ? '' : 'none';
  if (t) $('#tStatus').value = t.status;
  $('#taskModal').classList.add('show');
  $('#tText').focus();
}
function closeTask() { $('#taskModal').classList.remove('show'); }

$('#btnAddTask').addEventListener('click', function () {
  if (!currentBoard) { alert('Сначала создай доску'); return; }
  openTask(null);
});
$('#tCancel').addEventListener('click', closeTask);

$('#taskForm').addEventListener('submit', function (e) {
  e.preventDefault();
  const text = $('#tText').value.trim();
  if (!text) return;
  if (editingId) {
    const t = state.tasks.find(function (x) { return x.id === editingId; });
    const status = $('#tStatus').value;
    if (t) { t.text = text; t.status = status; render(); }
    api('updateTask', { id: editingId, text: text, status: status });
  } else {
    const author = $('#tAuthor').value.trim();
    store('tracker_author', author);
    api('addTask', { board: currentBoard, text: text, author: author });
  }
  closeTask();
});

// Вход
function showLogin(msg) {
  $('#loginMsg').textContent = msg || '';
  $('#loginModal').classList.add('show');
  $('#pw').value = '';
  $('#pw').focus();
}
$('#loginForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  password = $('#pw').value;
  $('#loginMsg').textContent = 'Проверяю…';
  const j = await load();
  if (j) {
    store('tracker_pw', password);
    $('#loginModal').classList.remove('show');
  }
});

// Esc закрывает окно задачи
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeTask();
});

// Автообновление раз в 30 секунд
setInterval(function () {
  const modalOpen = document.querySelector('.modal-bg.show');
  if (password && !modalOpen && !document.hidden) load(true);
}, 30000);

// Старт
if (API_URL.indexOf('ВСТАВЬ') === 0) {
  setStatus('Не указана ссылка на скрипт (API_URL в файле)', true);
} else if (password) {
  load();
} else {
  showLogin();
}
</script>
</body>
</html>
